[package]
name = "accio"
version = "0.1.0"
edition = "2024"
description = "Vault and topic paths for workflow skills"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
